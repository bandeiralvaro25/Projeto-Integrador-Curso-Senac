<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMatch - Take Um</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    /* Estilos gerais da página e tema padrão do site */
    body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 100px !important;
    background: linear-gradient(var(--bg-gradient-overlay), var(--bg-gradient-overlay)), 
                url('images/pipoca.png');
    background-size: 450px;
    background-repeat: repeat;
    animation: moverFundoDiagonal 50s linear infinite;
    color: var(--text-main);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

    /* Barra de Navegação (Navbar) */
    .navbar {
        background-color: #ffffff;
        border-bottom: 2px solid #810000;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .logo a {
        color: #810000;
        font-size: 22px;
        font-weight: bold;
        text-decoration: none;
    }

    .btn-menu-lateral {
        background-color: #810000;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
    }

    .btn-menu-lateral:hover {
        background-color: #590000;
    }

    /* Menu Lateral (Sidebar) */
    .sidebar {
        height: 100%;
        width: 280px;
        position: fixed;
        z-index: 1000;
        top: 0;
        left: -280px;
        background-color: #ffffff;
        overflow-x: hidden;
        transition: 0.3s;
        padding-top: 60px;
        box-shadow: 3px 0 10px rgba(0,0,0,0.1);
    }

    .sidebar a {
        padding: 12px 24px;
        text-decoration: none;
        font-size: 16px;
        color: #333;
        display: block;
        transition: 0.2s;
    }

    .sidebar a:hover {
        background-color: #f5f5f5;
        color: #810000;
    }

    .close-btn {
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 22px;
        background: none;
        border: none;
        cursor: pointer;
        color: #810000;
        font-weight: bold;
    }

    .sidebar-overlay {
        display: none;
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        background: rgba(0,0,0,0.4);
        z-index: 999;
    }

    /* Container Principal e Painel CineMatch */
    .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .painel-cinematch, .painel {
        background: #ffffff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        border: 1px solid #eee;
        max-width: 650px;
        margin: 0 auto;
    }

    h2.titulo-match {
        color: #810000;
        font-size: 24px;
        margin-top: 0;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    p.subtitulo-match {
        color: #666;
        font-size: 14px;
        margin-bottom: 25px;
        line-height: 1.5;
    }

    /* Formulário e Inputs */
    .form-group {
        margin-bottom: 20px;
        text-align: left;
    }

    .form-group label {
        display: block;
        font-weight: bold;
        color: #810000;
        font-size: 13px;
        margin-bottom: 6px;
    }

    .input-padrao, select, input[type="text"] {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
        box-sizing: border-box;
        transition: border-color 0.2s;
        background-color: #fff;
    }

    .input-padrao:focus, select:focus, input[type="text"]:focus {
        border-color: #810000;
    }

    /* Botão de Enviar / Buscar Match */
    .btn-cinematch {
        width: 100%;
        background-color: #810000;
        color: white;
        border: none;
        padding: 14px;
        border-radius: 6px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 10px;
    }

    .btn-cinematch:hover {
        background-color: #590000;
    }
</style>
<body>

    <!-- Menu Lateral (Sidebar) -->
    <div id="meuSidebar" class="sidebar">
        <button class="close-btn" onclick="fecharMenu()">×</button>
        <div style="padding: 0 24px 15px 24px; font-size: 18px; font-weight: bold; color: #810000; border-bottom: 2px solid #eee; margin-bottom: 10px;">
            🎬 Navegação
        </div>
        <a href="filmes.html">🎥 Filmes em Cartaz</a>
        <a href="compra.html">🎟️ Comprar Ingressos</a>
        <a href="ingressos.html">📦 Meus Ingressos</a>
        <a href="cinematch.html">🤝 CineMatch</a>
        <a href="recompensas.html">🏆 Recompensas</a>
        <a href="login.html">🔐 Entrar / Admin</a>
    </div>
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="fecharMenu()"></div>

    <header class="navbar">
        <div style="display: flex; align-items: center; gap: 12px;">
            <button class="btn-menu-lateral" onclick="abrirMenu()">☰ Menu</button>
            <div class="logo"><a href="filmes.html">CineMatch</a></div>
        </div>
    </header>

    <main class="container">
        <div class="card" style="max-width: 600px; margin: 40px auto;">
            <h1> CineMatch</h1>
            <p>Quer ir ao cinema mas ninguém quer ver o mesmo filme? Encontre companhia da sua faixa etária para a sessão!</p>

            <form id="formMatch" onsubmit="buscarMatch(event)" style="display: flex; flex-direction: column; gap: 14px; margin-top: 20px;">
                <div>
                    <label style="font-weight: bold; color: #810000;">Escolha o Filme:</label>
                    <input type="text" id="matchFilme" class="input-padrao" style="width: 100%;" required placeholder="Ex: Batman 2">
                </div>
                <div>
                    <label style="font-weight: bold; color: #810000;">Sua Faixa Etária:</label>
                    <select id="matchIdade" class="input-padrao" style="width: 100%;">
                        <option value="18-25">18 a 25 anos</option>
                        <option value="26-35">26 a 35 anos</option>
                        <option value="36+">Mais de 36 anos</option>
                    </select>
                </div>
                <button type="submit" class="btn-comprar" style="padding: 12px;">Encontrar Pessoas Interessadas</button>
            </form>

            <div id="resultadoMatch" style="margin-top: 20px;"></div>
        </div>
    </main>

    <script>
        function abrirMenu() {
            document.getElementById("meuSidebar").style.left = "0";
            document.getElementById("sidebarOverlay").style.display = "block";
        }

        function fecharMenu() {
            document.getElementById("meuSidebar").style.left = "-270px";
            document.getElementById("sidebarOverlay").style.display = "none";
        }

        function buscarMatch(e) {
            e.preventDefault();
            const filme = document.getElementById('matchFilme').value;
            const container = document.getElementById('resultadoMatch');
            
            container.innerHTML = `
                <div style="background: #e6f4ea; padding: 15px; border-radius: 8px; border: 1px solid #34a853;">
                    <h3 style="color: #137333; margin-top: 0;">Parceiros encontrados!</h3>
                    <p>Encontramos <strong>3 pessoas</strong> da sua faixa etária querendo ver <em>${filme}</em> neste fim de semana.</p>
                    <button onclick="alert('Convite enviado com sucesso! Aguarde a resposta.')" class="btn-comprar" style="background: #34a853; padding: 8px 16px; font-size: 14px;">Conectar com o Grupo</button>
                </div>
            `;
        }
    </script>
</body>
</html>
