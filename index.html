<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Take Um</title>
    <style>
        

        /* Estilos gerais e fundo padrão com transparência suave */
        /* Estilos gerais e fundo padrão imóvel com transparência suave */
/* Estilos gerais e fundo imóvel com imagem única (sem duplicação) e transparência */
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #fcf6ec;
    background-image: linear-gradient(rgba(252, 246, 236, 0.88), rgba(252, 246, 236, 0.88)), 
                      url('images/image.png');
    background-size: cover;          /* Estica a imagem para cobrir toda a tela sem repetir */
    background-repeat: no-repeat;    /* Evita que a imagem se multiplique (duplique) */
    background-attachment: fixed;    /* Mantém a imagem imóvel ao rolar a página */
    background-position: center;     /* Centraliza a imagem no ecrã */
    color: #333333;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
}

        /* Barra de Navegação (Navbar) */
        .navbar {
            background-color: #ffffff;
            border-bottom: 2px solid #810000;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
        }

        .btn-menu-lateral {
            background-color: #810000;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn-menu-lateral:hover {
            background-color: #590000;
        }

        .logo a {
            color: #810000;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
        }

        /* Menu Lateral (Sidebar) */
        .sidebar {
            height: 100%;
            width: 280px;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: -280px;
            background-color: #ffffff;
            overflow-x: hidden;
            transition: left 0.3s ease;
            padding-top: 60px;
            box-shadow: 3px 0 12px rgba(0, 0, 0, 0.12);
        }

        .sidebar a {
            padding: 12px 24px;
            text-decoration: none;
            font-size: 16px;
            color: #333333;
            display: block;
            transition: 0.2s;
        }

        .sidebar a:hover {
            background-color: #f8f0f0;
            color: #810000;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 22px;
            background: none;
            border: none;
            cursor: pointer;
            color: #810000;
            font-weight: bold;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 999;
        }

        /* Container Principal e Painel de Cadastro */
        .container {
            max-width: 520px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .painel-cadastro {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 35px 40px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
            border: 1px solid #f0e6d8;
        }

        .cadastro-titulo {
            color: #810000;
            font-size: 24px;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 6px;
        }

        .cadastro-subtitulo {
            color: #666666;
            font-size: 13.5px;
            margin-bottom: 22px;
        }

        /* Botões unificados (Google e Criar Conta com larguras, alturas e paddings idênticos) */
        .btn-google, .btn-submit {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-sizing: border-box;
            cursor: pointer;
            transition: background 0.2s;
        }

        /* Estilo específico do botão do Google */
        .btn-google {
            background-color: #ffffff;
            color: #444444;
            border: 1px solid #d4a373;
            margin-bottom: 6px;
        }

        .btn-google:hover {
            background-color: #fdfaf6;
        }

        /* Ajuste do ícone do Google para o tamanho perfeito do botão */
        .btn-google img, .btn-google svg {
            width: 18px !important;
            height: 18px !important;
            min-width: 18px;
            min-height: 18px;
            flex-shrink: 0;
        }

        /* Estilo específico do botão Criar Conta */
        .btn-submit {
            background-color: #810000;
            color: #ffffff;
            border: none;
            margin-top: 6px;
        }

        .btn-submit:hover {
            background-color: #590000;
        }

        /* Divisor com texto */
        .divisor {
            display: flex;
            align-items: center;
            text-align: center;
            color: #999999;
            font-size: 12px;
            margin: 22px 0;
        }

        .divisor::before, .divisor::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e8dcd0;
        }

        .divisor::before {
            margin-right: 12px;
        }

        .divisor::after {
            margin-left: 12px;
        }

        /* Campos e Formulário */
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            color: #333333;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .input-padrao {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #d4a373;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            background-color: #ffffff;
            color: #333;
            transition: border-color 0.2s;
        }

        .input-padrao::placeholder {
            color: #aaa;
        }

        .input-padrao:focus {
            border-color: #810000;
        }

        /* Mensagens de feedback */
        .msg {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            font-weight: 600;
        }
        .msg.ok {
            color: #2e7d32;
        }

        /* Rodapé do card (Já tem uma conta?) */
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .login-link a {
            color: #810000;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Menu Lateral (Sidebar) -->
    <div id="meuSidebar" class="sidebar">
        <button class="close-btn" onclick="fecharMenu()">×</button>
        <div style="padding: 0 24px 15px 24px; font-size: 18px; font-weight: bold; color: #810000; border-bottom: 2px solid #eee; margin-bottom: 10px;">
            🎬 Navegação
        </div>
        <a href="filmes.html">🎥 Filmes em Cartaz</a>
        <a href="compra.html">🎟️ Comprar Ingressos</a>
        <a href="ingressos.html">📦 Meus Ingressos</a>
        <a href="cinematch.html">🤝 CineMatch</a>
        <a href="passaporte.html">🏆 Passaporte Digital</a>
        <a href="login.html">🔐 Entrar / Admin</a>
    </div>
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="fecharMenu()"></div>

    <!-- Barra de Navegação -->
    <header class="navbar">
        <div style="display: flex; align-items: center; gap: 12px;">
            <button class="btn-menu-lateral" onclick="abrirMenu()">☰ Menu</button>
            <div class="logo">
                <a href="index.html">Criar Conta</a>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container">
        <div class="painel-cadastro">
            <h1 class="cadastro-titulo">Criar Conta</h1>
            <p class="cadastro-subtitulo">Registe-se para começar a comprar os seus bilhetes de cinema.</p>
            
            <button type="button" class="btn-google" onclick="cadastrarGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
                Registrar com o Google
            </button>

            <div class="divisor">ou cadastre-se com e-mail</div>

            <form id="formCadastro">
                <div class="form-group">
                    <label for="nomeCompleto">Nome Completo</label>
                    <input type="text" id="nomeCompleto" class="input-padrao" placeholder="Digite o seu nome completo" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" class="input-padrao" placeholder="exemplo@email.com" required>
                </div>

                <div class="form-group">
                    <label for="senha">Palavra-passe</label>
                    <input type="password" id="senha" class="input-padrao" placeholder="Crie uma palavra-passe segura" required>
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone / WhatsApp</label>
                    <input type="tel" id="telefone" class="input-padrao" placeholder="(00) 00000-0000" required>
                </div>

                <button type="submit" class="btn-submit">Criar Conta</button>
            </form>

            <div id="mensagem" class="msg"></div>

            <div class="login-link">
                Já tem uma conta? <a href="login.html">Faça login</a>
            </div>
        </div>
    </main>

    <!-- Scripts de Interação -->
    <script>
        function abrirMenu() {
            document.getElementById("meuSidebar").style.left = "0";
            document.getElementById("sidebarOverlay").style.display = "block";
        }

        function fecharMenu() {
            document.getElementById("meuSidebar").style.left = "-280px";
            document.getElementById("sidebarOverlay").style.display = "none";
        }

        document.getElementById('formCadastro').addEventListener('submit', function(e) {
            e.preventDefault();
            const msg = document.getElementById('mensagem');
            msg.className = 'msg ok';
            msg.textContent = 'Conta criada com sucesso! A redirecionar...';
            setTimeout(() => {
                window.location.href = 'filmes.html';
            }, 1500);
        });

        function cadastrarGoogle() {
            const msg = document.getElementById('mensagem');
            msg.className = 'msg ok';
            msg.textContent = 'A autenticar com o Google...';
            setTimeout(() => {
                window.location.href = 'filmes.html';
            }, 1500);
        }
    </script>
</body>
</html>
